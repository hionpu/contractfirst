[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contractfirst"
version = "0.1.0"
description = "MCP server providing deterministic, non-bypassable checkpoints for the contractfirst workflow."
requires-python = ">=3.11"
authors = [{ name = "contractfirst" }]
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
contractfirst = "contractfirst.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
